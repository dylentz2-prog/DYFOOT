name: Build DYFOOT Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Debug & Release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure Android SDK & accept licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sudo chown -R "$(id -u):$(id -g)" "$SDK_DIR" || true
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"

          SDKMANAGER_BIN="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER_BIN" ] && [ -x "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER_BIN="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          fi
          if [ -z "$SDKMANAGER_BIN" ]; then
            SDKMANAGER_BIN="$(find "$SDK_DIR/cmdline-tools" -maxdepth 3 -name sdkmanager -type f 2>/dev/null | head -n 1 || true)"
          fi

          if [ -n "$SDKMANAGER_BIN" ]; then
            echo "Using sdkmanager at $SDKMANAGER_BIN"
            (yes 2>/dev/null || true) | "$SDKMANAGER_BIN" --sdk_root="$SDK_DIR" --licenses > /dev/null || true
            (yes 2>/dev/null || true) | "$SDKMANAGER_BIN" --sdk_root="$SDK_DIR" --install "cmdline-tools;latest" "platform-tools" "platforms;android-36" "build-tools;36.0.0" || true
            (yes 2>/dev/null || true) | "$SDKMANAGER_BIN" --sdk_root="$SDK_DIR" --install "platforms;android-36.1" || true
            ls -la "$SDK_DIR/platforms" || true
          else
            echo "::warning::sdkmanager not found in $SDK_DIR; relying on preinstalled SDK."
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Prepare debug keystore for debugConfig signing
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          rm -f debug.keystore
          if [ -f debug.keystore.base64 ]; then
            echo "Decoding debug.keystore from debug.keystore.base64..."
            if tr -d '[:space:]' < debug.keystore.base64 | base64 -d > debug.keystore 2>/dev/null && test -s debug.keystore; then
              echo "KEYSTORE_SOURCE=repo_base64" >> "$GITHUB_ENV"
            else
              rm -f debug.keystore
              echo "::warning::debug.keystore.base64 could not be decoded; generating fallback debug.keystore."
            fi
          elif [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "Decoding debug.keystore from DEBUG_KEYSTORE_BASE64 secret..."
            if printf '%s' "$DEBUG_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > debug.keystore 2>/dev/null \
              && test -s debug.keystore \
              && keytool -list -keystore debug.keystore -storepass android >/dev/null 2>&1; then
              echo "KEYSTORE_SOURCE=github_secret" >> "$GITHUB_ENV"
            else
              rm -f debug.keystore
              echo "::warning::DEBUG_KEYSTORE_BASE64 secret is invalid (not a Base64 debug.keystore). Delete DEBUG_KEYSTORE_BASE64 in GitHub Secrets or paste valid debug.keystore.base64. Falling back to generated debug.keystore."
            fi
          fi
          if [ ! -f debug.keystore ]; then
            echo "Generating standard Android debug.keystore..."
            keytool -genkeypair -noprompt -v \
              -keystore debug.keystore \
              -storetype PKCS12 \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "KEYSTORE_SOURCE=ephemeral_generated" >> "$GITHUB_ENV"
          fi
          test -s debug.keystore
          echo "Debug keystore public certificate fingerprints (register SHA1 in Firebase Console if using newly generated keystore):"
          keytool -list -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android 2>/dev/null | grep -E 'SHA1:|SHA256:' || true

      - name: Prepare .env & Firebase config
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          MOBILE_MONEY_MERCHANT_KEY: ${{ secrets.MOBILE_MONEY_MERCHANT_KEY }}
          DATASPORTS_API_KEY: ${{ secrets.DATASPORTS_API_KEY }}
          LIVE_FOOTBALL_API_KEY: ${{ secrets.LIVE_FOOTBALL_API_KEY }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ ! -f .env.example ]; then
            printf '%s\n' \
              'FOOTBALL_DATA_API_KEY=YOUR_FOOTBALL_DATA_API_KEY' \
              'MOBILE_MONEY_MERCHANT_KEY=YOUR_MOBILE_MONEY_MERCHANT_KEY' \
              'DATASPORTS_API_KEY=YOUR_DATASPORTS_API_KEY' \
              'LIVE_FOOTBALL_API_KEY=YOUR_LIVE_FOOTBALL_API_KEY' > .env.example
          fi
          cp .env.example .env
          if [ -n "$FOOTBALL_DATA_API_KEY" ]; then
            grep -v '^FOOTBALL_DATA_API_KEY=' .env > .env.tmp && mv .env.tmp .env
            printf 'FOOTBALL_DATA_API_KEY=%s\n' "$FOOTBALL_DATA_API_KEY" >> .env
          fi
          if [ -n "$MOBILE_MONEY_MERCHANT_KEY" ]; then
            grep -v '^MOBILE_MONEY_MERCHANT_KEY=' .env > .env.tmp && mv .env.tmp .env
            printf 'MOBILE_MONEY_MERCHANT_KEY=%s\n' "$MOBILE_MONEY_MERCHANT_KEY" >> .env
          fi
          if [ -n "$DATASPORTS_API_KEY" ]; then
            grep -v '^DATASPORTS_API_KEY=' .env > .env.tmp && mv .env.tmp .env
            printf 'DATASPORTS_API_KEY=%s\n' "$DATASPORTS_API_KEY" >> .env
          fi
          if [ -n "$LIVE_FOOTBALL_API_KEY" ]; then
            grep -v '^LIVE_FOOTBALL_API_KEY=' .env > .env.tmp && mv .env.tmp .env
            printf 'LIVE_FOOTBALL_API_KEY=%s\n' "$LIVE_FOOTBALL_API_KEY" >> .env
          fi
          if [ ! -f app/google-services.json ] && [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s\n' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            if ! python3 -m json.tool app/google-services.json >/dev/null 2>&1; then
              if printf '%s' "$GOOGLE_SERVICES_JSON" | tr -d '[:space:]' | base64 -d > app/google-services.json.tmp 2>/dev/null \
                && python3 -m json.tool app/google-services.json.tmp >/dev/null 2>&1; then
                mv app/google-services.json.tmp app/google-services.json
              else
                rm -f app/google-services.json app/google-services.json.tmp
                echo "::warning::GOOGLE_SERVICES_JSON secret is not valid JSON. Copy the exact contents of app/google-services.json (starting with { and ending with }) into GOOGLE_SERVICES_JSON."
              fi
            fi
          elif [ ! -f app/google-services.json ] && [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            if printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | tr -d '[:space:]' | base64 -d > app/google-services.json.tmp 2>/dev/null \
              && python3 -m json.tool app/google-services.json.tmp >/dev/null 2>&1; then
              mv app/google-services.json.tmp app/google-services.json
            else
              rm -f app/google-services.json app/google-services.json.tmp
              echo "::warning::GOOGLE_SERVICES_JSON_BASE64 secret could not be decoded as valid JSON."
            fi
          fi
          if [ -f app/google-services.json ] && python3 -m json.tool app/google-services.json >/dev/null 2>&1; then
            echo "Verified app/google-services.json is valid JSON."
            echo "FIREBASE_CONFIG_PRESENT=true" >> "$GITHUB_ENV"
          else
            rm -f app/google-services.json
            echo "FIREBASE_CONFIG_PRESENT=false" >> "$GITHUB_ENV"
            echo "::warning::app/google-services.json is missing or invalid in GitHub. Add app/google-services.json or set a valid GOOGLE_SERVICES_JSON secret in GitHub Actions."
          fi

      - name: Build Debug APK
        run: |
          gradle :app:assembleDebug --no-daemon --console=plain -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"

      - name: Write APK build status summary
        if: always()
        run: |
          {
            echo "### DYFOOT APK Build Status"
            echo ""
            if [ "${FIREBASE_CONFIG_PRESENT:-false}" = "true" ]; then
              echo "- **Firebase (app/google-services.json):** Included (Ready for Firebase Auth & Firestore)"
            else
              echo "- **Firebase (app/google-services.json):** MISSING — Add GOOGLE_SERVICES_JSON (or GOOGLE_SERVICES_JSON_BASE64) in GitHub Repository Secrets, or upload app/google-services.json, otherwise the APK opens to the Firebase Setup screen."
            fi
            if [ "${KEYSTORE_SOURCE:-}" = "ephemeral_generated" ]; then
              echo "- **Debug Signing Keystore:** Ephemeral generated — Add DEBUG_KEYSTORE_BASE64 in GitHub Secrets so Google Sign-In SHA-1 matches Firebase."
            else
              echo "- **Debug Signing Keystore:** Included (${KEYSTORE_SOURCE:-ok})"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dyfoot-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Run unit tests
        run: |
          gradle :app:testDebugUnitTest --no-daemon --console=plain -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"

      - name: Build Signed Release APK (when release keystore secrets are set)
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | tr -d '\r\n' | base64 -d > "$RUNNER_TEMP/my-upload-key.jks"
            export KEYSTORE_PATH="$RUNNER_TEMP/my-upload-key.jks"
            gradle :app:assembleRelease --no-daemon --console=plain -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
            echo "RELEASE_APK_BUILT=true" >> "$GITHUB_ENV"
          else
            echo "Skipping Release APK: add RELEASE_KEYSTORE_BASE64, STORE_PASSWORD, and KEY_PASSWORD in GitHub repository secrets to build app-release.apk."
          fi

      - name: Upload Signed Release APK artifact
        if: env.RELEASE_APK_BUILT == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dyfoot-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Clean up temporary keystores and env file
        if: always()
        run: |
          rm -f debug.keystore .env "$RUNNER_TEMP/my-upload-key.jks"
