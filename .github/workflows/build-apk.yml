name: Build DYFOOT Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Debug & Release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure Android SDK & accept licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sudo chown -R "$(id -u):$(id -g)" "$SDK_DIR" || true
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"

          SDKMANAGER_BIN="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER_BIN" ] && [ -x "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER_BIN="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          fi
          if [ -z "$SDKMANAGER_BIN" ]; then
            SDKMANAGER_BIN="$(find "$SDK_DIR/cmdline-tools" -maxdepth 3 -name sdkmanager -type f 2>/dev/null | head -n 1 || true)"
          fi

          if [ -n "$SDKMANAGER_BIN" ]; then
            echo "Using sdkmanager at $SDKMANAGER_BIN"
            (yes 2>/dev/null || true) | "$SDKMANAGER_BIN" --sdk_root="$SDK_DIR" --licenses > /dev/null || true
            (yes 2>/dev/null || true) | "$SDKMANAGER_BIN" --sdk_root="$SDK_DIR" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" || true
            (yes 2>/dev/null || true) | "$SDKMANAGER_BIN" --sdk_root="$SDK_DIR" --install "platforms;android-36.1" > /dev/null 2>&1 || true
          else
            echo "::warning::sdkmanager not found in $SDK_DIR; relying on preinstalled SDK."
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Prepare debug keystore for debugConfig signing
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -f debug.keystore.base64 ]; then
            echo "Decoding debug.keystore from debug.keystore.base64..."
            tr -d '\r\n' < debug.keystore.base64 | base64 -d > debug.keystore
          elif [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "Decoding debug.keystore from DEBUG_KEYSTORE_BASE64 secret..."
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | tr -d '\r\n' | base64 -d > debug.keystore
          elif [ ! -f debug.keystore ]; then
            echo "debug.keystore.base64 not found; generating standard Android debug.keystore..."
            keytool -genkeypair -noprompt -v \
              -keystore debug.keystore \
              -storetype PKCS12 \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          test -s debug.keystore

      - name: Prepare .env & Firebase config
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          MOBILE_MONEY_MERCHANT_KEY: ${{ secrets.MOBILE_MONEY_MERCHANT_KEY }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ ! -f .env.example ]; then
            printf '%s\n' \
              'FOOTBALL_DATA_API_KEY=YOUR_FOOTBALL_DATA_API_KEY' \
              'MOBILE_MONEY_MERCHANT_KEY=YOUR_MOBILE_MONEY_MERCHANT_KEY' > .env.example
          fi
          cp .env.example .env
          if [ -n "$FOOTBALL_DATA_API_KEY" ]; then
            grep -v '^FOOTBALL_DATA_API_KEY=' .env > .env.tmp && mv .env.tmp .env
            printf 'FOOTBALL_DATA_API_KEY=%s\n' "$FOOTBALL_DATA_API_KEY" >> .env
          fi
          if [ -n "$MOBILE_MONEY_MERCHANT_KEY" ]; then
            grep -v '^MOBILE_MONEY_MERCHANT_KEY=' .env > .env.tmp && mv .env.tmp .env
            printf 'MOBILE_MONEY_MERCHANT_KEY=%s\n' "$MOBILE_MONEY_MERCHANT_KEY" >> .env
          fi
          if [ ! -f app/google-services.json ] && [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | tr -d '\r\n' | base64 -d > app/google-services.json
          fi

      - name: Run unit tests & build Debug APK
        run: |
          gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dyfoot-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Build Signed Release APK (when release keystore secrets are set)
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | tr -d '\r\n' | base64 -d > "$RUNNER_TEMP/my-upload-key.jks"
            export KEYSTORE_PATH="$RUNNER_TEMP/my-upload-key.jks"
            gradle :app:assembleRelease --no-daemon --stacktrace
            echo "RELEASE_APK_BUILT=true" >> "$GITHUB_ENV"
          else
            echo "Skipping Release APK: add RELEASE_KEYSTORE_BASE64, STORE_PASSWORD, and KEY_PASSWORD in GitHub repository secrets to build app-release.apk."
          fi

      - name: Upload Signed Release APK artifact
        if: env.RELEASE_APK_BUILT == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dyfoot-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Clean up temporary keystores and env file
        if: always()
        run: |
          rm -f debug.keystore .env "$RUNNER_TEMP/my-upload-key.jks"
