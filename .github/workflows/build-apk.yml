name: Build DYFOOT Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Debug & Release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure Android SDK & accept licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sudo chown -R "$(id -u):$(id -g)" "$SDK_DIR" || true
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"

          SDKMANAGER_BIN="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER_BIN" ] && [ -x "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER_BIN="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          fi
          if [ -z "$SDKMANAGER_BIN" ]; then
            SDKMANAGER_BIN="$(find "$SDK_DIR/cmdline-tools" -maxdepth 3 -name sdkmanager -type f 2>/dev/null | head -n 1 || true)"
          fi

          if [ -n "$SDKMANAGER_BIN" ]; then
            echo "Using sdkmanager at $SDKMANAGER_BIN"
            (yes 2>/dev/null || true) | "$SDKMANAGER_BIN" --sdk_root="$SDK_DIR" --licenses > /dev/null || true
            (yes 2>/dev/null || true) | "$SDKMANAGER_BIN" --sdk_root="$SDK_DIR" --install "cmdline-tools;latest" "platform-tools" "platforms;android-36" "build-tools;36.0.0" || true
            (yes 2>/dev/null || true) | "$SDKMANAGER_BIN" --sdk_root="$SDK_DIR" --install "platforms;android-36.1" || true
            ls -la "$SDK_DIR/platforms" || true
          else
            echo "::warning::sdkmanager not found in $SDK_DIR; relying on preinstalled SDK."
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Prepare debug keystore for debugConfig signing
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          rm -f debug.keystore
          if [ -f debug.keystore.base64 ]; then
            echo "Decoding debug.keystore from debug.keystore.base64..."
            if tr -d '[:space:]' < debug.keystore.base64 | base64 -d > debug.keystore 2>/dev/null \
              && test -s debug.keystore \
              && keytool -list -keystore debug.keystore -storepass android >/dev/null 2>&1; then
              echo "KEYSTORE_SOURCE=repo_base64" >> "$GITHUB_ENV"
            else
              rm -f debug.keystore
              echo "Note: debug.keystore.base64 could not be decoded cleanly; checking DEBUG_KEYSTORE_BASE64 secret."
            fi
          fi
          if [ ! -f debug.keystore ] && [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "Decoding debug.keystore from DEBUG_KEYSTORE_BASE64 secret..."
            if printf '%s' "$DEBUG_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > debug.keystore 2>/dev/null \
              && test -s debug.keystore \
              && keytool -list -keystore debug.keystore -storepass android >/dev/null 2>&1; then
              echo "KEYSTORE_SOURCE=github_secret" >> "$GITHUB_ENV"
            else
              rm -f debug.keystore
              echo "Note: DEBUG_KEYSTORE_BASE64 secret skipped (invalid Base64). Falling back to generated debug.keystore."
            fi
          fi
          if [ ! -f debug.keystore ]; then
            echo "Generating standard Android debug.keystore..."
            keytool -genkeypair -noprompt -v \
              -keystore debug.keystore \
              -storetype PKCS12 \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "KEYSTORE_SOURCE=ephemeral_generated" >> "$GITHUB_ENV"
          fi
          test -s debug.keystore
          ACTIVE_SHA1="$(keytool -list -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android 2>/dev/null | sed -n 's/.*SHA1:[[:space:]]*//p' | head -n 1)"
          ACTIVE_SHA256="$(keytool -list -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android 2>/dev/null | sed -n 's/.*SHA256:[[:space:]]*//p' | head -n 1)"
          ACTIVE_SHA1_HASH="$(printf '%s' "$ACTIVE_SHA1" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          echo "ACTIVE_DEBUG_SHA1=$ACTIVE_SHA1" >> "$GITHUB_ENV"
          echo "ACTIVE_DEBUG_SHA256=$ACTIVE_SHA256" >> "$GITHUB_ENV"
          echo "ACTIVE_DEBUG_SHA1_HASH=$ACTIVE_SHA1_HASH" >> "$GITHUB_ENV"
          echo "Debug keystore public certificate fingerprints:"
          echo "  SHA1: $ACTIVE_SHA1"
          echo "  SHA256: $ACTIVE_SHA256"

      - name: Prepare .env & Firebase config
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          MOBILE_MONEY_MERCHANT_KEY: ${{ secrets.MOBILE_MONEY_MERCHANT_KEY }}
          DATASPORTS_API_KEY: ${{ secrets.DATASPORTS_API_KEY }}
          LIVE_FOOTBALL_API_KEY: ${{ secrets.LIVE_FOOTBALL_API_KEY }}
          LIVESTREAM_API_KEY: ${{ secrets.LIVESTREAM_API_KEY }}
          LIVESTREAM_FEED_URL: ${{ secrets.LIVESTREAM_FEED_URL }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ ! -f .env.example ]; then
            printf '%s\n' \
              'DATASPORTS_API_KEY=YOUR_DATASPORTS_API_KEY' \
              'LIVE_FOOTBALL_API_KEY=YOUR_LIVE_FOOTBALL_API_KEY' \
              'FOOTBALL_DATA_API_KEY=YOUR_FOOTBALL_DATA_API_KEY' \
              'LIVESTREAM_API_KEY=YOUR_LIVESTREAM_API_KEY' \
              'LIVESTREAM_FEED_URL=YOUR_LIVESTREAM_FEED_URL' \
              'MOBILE_MONEY_MERCHANT_KEY=YOUR_MOBILE_MONEY_MERCHANT_KEY' > .env.example
          fi
          cp .env.example .env
          upsert_env() {
            KEY="$1"
            VAL="$2"
            if [ -n "$VAL" ]; then
              grep -v "^${KEY}=" .env > .env.tmp && mv .env.tmp .env
              printf '%s=%s\n' "$KEY" "$VAL" >> .env
            fi
          }
          upsert_env "FOOTBALL_DATA_API_KEY" "$FOOTBALL_DATA_API_KEY"
          upsert_env "MOBILE_MONEY_MERCHANT_KEY" "$MOBILE_MONEY_MERCHANT_KEY"
          upsert_env "DATASPORTS_API_KEY" "$DATASPORTS_API_KEY"
          upsert_env "LIVE_FOOTBALL_API_KEY" "$LIVE_FOOTBALL_API_KEY"
          upsert_env "LIVESTREAM_API_KEY" "$LIVESTREAM_API_KEY"
          upsert_env "LIVESTREAM_FEED_URL" "$LIVESTREAM_FEED_URL"

          # If GOOGLE_SERVICES_JSON(_BASE64) secret is set and valid JSON, prefer it so updated secrets override stale repo files
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s\n' "$GOOGLE_SERVICES_JSON" > app/google-services.json.secret
            if python3 -m json.tool app/google-services.json.secret >/dev/null 2>&1; then
              mv app/google-services.json.secret app/google-services.json
              echo "Loaded app/google-services.json from GOOGLE_SERVICES_JSON secret."
            elif printf '%s' "$GOOGLE_SERVICES_JSON" | tr -d '[:space:]' | base64 -d > app/google-services.json.secret 2>/dev/null \
              && python3 -m json.tool app/google-services.json.secret >/dev/null 2>&1; then
              mv app/google-services.json.secret app/google-services.json
              echo "Loaded app/google-services.json from base64 GOOGLE_SERVICES_JSON secret."
            else
              rm -f app/google-services.json.secret
              echo "Note: GOOGLE_SERVICES_JSON secret skipped (not valid JSON); keeping repo app/google-services.json if present."
            fi
          elif [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            if printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | tr -d '[:space:]' | base64 -d > app/google-services.json.secret 2>/dev/null \
              && python3 -m json.tool app/google-services.json.secret >/dev/null 2>&1; then
              mv app/google-services.json.secret app/google-services.json
              echo "Loaded app/google-services.json from GOOGLE_SERVICES_JSON_BASE64 secret."
            else
              rm -f app/google-services.json.secret
              echo "Note: GOOGLE_SERVICES_JSON_BASE64 secret skipped (could not decode as JSON)."
            fi
          fi

          if [ -f app/google-services.json ] && python3 -m json.tool app/google-services.json >/dev/null 2>&1; then
            echo "Verified app/google-services.json is valid JSON."
            echo "FIREBASE_CONFIG_PRESENT=true" >> "$GITHUB_ENV"
            if [ -n "${ACTIVE_DEBUG_SHA1_HASH:-}" ] && grep -qi "$ACTIVE_DEBUG_SHA1_HASH" app/google-services.json; then
              echo "FIREBASE_SHA1_MATCHED=true" >> "$GITHUB_ENV"
            else
              echo "FIREBASE_SHA1_MATCHED=false" >> "$GITHUB_ENV"
              echo "Note: Signing SHA-1 ($ACTIVE_DEBUG_SHA1) is not inside app/google-services.json."
            fi
          else
            rm -f app/google-services.json
            echo "FIREBASE_CONFIG_PRESENT=false" >> "$GITHUB_ENV"
            echo "FIREBASE_SHA1_MATCHED=false" >> "$GITHUB_ENV"
            echo "Note: app/google-services.json is missing or invalid in GitHub."
          fi

      - name: Build Debug APK
        run: |
          gradle :app:assembleDebug --no-daemon --console=plain -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"

      - name: Write APK build status summary
        if: always()
        run: |
          {
            echo "### DYFOOT APK Build Status"
            echo ""
            if [ "${FIREBASE_CONFIG_PRESENT:-false}" = "true" ]; then
              echo "- **Firebase (app/google-services.json):** Included (Ready for Firebase Auth & Firestore)"
            else
              echo "- **Firebase (app/google-services.json):** MISSING — Add GOOGLE_SERVICES_JSON (or GOOGLE_SERVICES_JSON_BASE64) in GitHub Repository Secrets, or upload app/google-services.json, otherwise the APK opens to the Firebase Setup screen."
            fi
            if [ "${KEYSTORE_SOURCE:-}" = "ephemeral_generated" ]; then
              echo "- **Debug Signing Keystore:** Ephemeral generated — Push \`debug.keystore.base64\` to GitHub OR set valid \`DEBUG_KEYSTORE_BASE64\` in GitHub Secrets so SHA-1 stops changing every build."
            else
              echo "- **Debug Signing Keystore:** Included (${KEYSTORE_SOURCE:-ok})"
            fi
            echo "- **Debug APK SHA-1:** \`${ACTIVE_DEBUG_SHA1:-unknown}\`"
            echo "- **Debug APK SHA-256:** \`${ACTIVE_DEBUG_SHA256:-unknown}\`"
            if [ "${FIREBASE_SHA1_MATCHED:-false}" = "true" ]; then
              echo "- **Google Sign-In Fingerprint Check:** MATCHED (Debug APK SHA-1 is registered in \`app/google-services.json\`)"
            else
              echo "- **Google Sign-In Fingerprint Check:** MISMATCH — This APK's SHA-1 is NOT in \`app/google-services.json\`! Google Sign-In will loop on the login screen until you push \`debug.keystore.base64\` (and \`app/google-services.json\`) or add this SHA-1 in Firebase Console."
            fi
            echo "- **Note:** Install \`dyfoot-debug-apk\` unless you also registered your release keystore SHA-1 in Firebase Console."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dyfoot-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Run unit tests
        run: |
          gradle :app:testDebugUnitTest --no-daemon --console=plain -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"

      - name: Build Signed Release APK (when release keystore secrets are set)
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | tr -d '\r\n' | base64 -d > "$RUNNER_TEMP/my-upload-key.jks"
            export KEYSTORE_PATH="$RUNNER_TEMP/my-upload-key.jks"
            gradle :app:assembleRelease --no-daemon --console=plain -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
            echo "RELEASE_APK_BUILT=true" >> "$GITHUB_ENV"
          else
            echo "Skipping Release APK: add RELEASE_KEYSTORE_BASE64, STORE_PASSWORD, and KEY_PASSWORD in GitHub repository secrets to build app-release.apk."
          fi

      - name: Upload Signed Release APK artifact
        if: env.RELEASE_APK_BUILT == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dyfoot-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Clean up temporary keystores and env file
        if: always()
        run: |
          rm -f debug.keystore .env "$RUNNER_TEMP/my-upload-key.jks"
